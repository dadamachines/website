- id: automat
  eyebrow: MIDI meets the physical world.
  title: Turn objects into instruments.
  description: The automat toolkit brings together a plug-and-play MIDI controller, solenoid beaters and mounting accessories. Play everyday objects, acoustic instruments or your own kinetic installation. No coding or soldering required.
