- id: every-division
  eyebrow: A collaboration with polytemporal instruments
  title: every division and duration
  description: A polytemporal instrument in 12HP Eurorack format. Play with six musically connected tempi and create tuplets in real time via a grid MIDI controller. Time itself becomes an expressive musical parameter.
